name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false

      - name: Check formatting
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "以下文件未通过 gofmt 检查："
            echo "$unformatted"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -race ./...

      - name: Build
        shell: bash
        run: |
          mkdir -p dist
          suffix=""
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            suffix=".exe"
          fi
          go build -trimpath \
            -ldflags "-s -w -X main.version=${GITHUB_REF_NAME} -X main.commit=${GITHUB_SHA::7}" \
            -o "dist/test_go_wails${suffix}" ./cmd/app

      - name: Smoke test
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          ./dist/test_go_wails -addr 127.0.0.1:34115 -no-open &
          app_pid=$!
          trap 'kill "$app_pid" 2>/dev/null || true' EXIT

          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:34115/api/health -o health.json; then
              break
            fi
            sleep 0.3
          done
          grep -q '"status":"ok"' health.json

          curl -fsS -X POST http://127.0.0.1:34115/api/call \
            -H 'Content-Type: application/json' \
            -d '{"method":"greeter.greet","params":{"name":"CI"}}' \
            -o greet.json
          grep -q 'CI' greet.json

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: test_go_wails-${{ matrix.os }}
          path: dist/*
          if-no-files-found: error
          retention-days: 7
